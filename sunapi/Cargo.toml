[package]
name = "sunapi"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sunapi"

[dependencies]
axum = { version = "0.8.7", default-features = false, features = ["json", "query", "macros"] }
bytes = "1.8.0"
http = "1.3.1"
http-body-util = "0.1.3"
jiff = { version = "0.2.16", features = ["serde"] }
reqwest = { version = "0.13.0", features = ["stream"], optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
solarcalc = { version = "0.1.0", path = "../solarcalc" }
tokio = { version = "1.48.0", features = ["net", "rt-multi-thread", "time", "macros"], optional = true }
utoipa = { version = "5.4.0", features = ["axum_extras", "jiff_0_2"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.7"
const_format = { version = "0.2.35", features = ["rust_1_83"] }
expect-test = "1.5.1"
http-body-util = "0.1.3"
hyper-util = { version = "0.1.18", features = ["client-legacy"] }
serde_json = "1.0.145"
testresult = "0.4.1"
tower = "0.5.2"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
turmoil = "0.7.0"

[features]
default = ["tokio"]
tokio = ["dep:tokio", "dep:reqwest", "axum/tokio", "axum/http1", "axum/http2"]
