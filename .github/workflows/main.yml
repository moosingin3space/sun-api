name: Main Branch

on:
    push:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Run lint
              uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
              with:
                  version: "0.20.1"
                  cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
                  call: lint --source=.

    test:
        name: Test
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Run tests
              uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
              with:
                  version: "0.20.1"
                  cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
                  call: test --source=.

    test-cf-worker:
        name: Test Cloudflare Worker
        runs-on: ubuntu-latest
        needs: [lint, test]
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Run Cloudflare Worker tests
              uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
              with:
                  version: "0.20.1"
                  cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
                  call: cf-worker-test --source=.

    build-and-publish:
        name: Build and Publish Container
        runs-on: ubuntu-latest
        needs: [lint, test, test-cf-worker]
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and publish container
              uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
              with:
                  version: "0.20.1"
                  cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
                  call: publish --source=. --address=ghcr.io/${{ github.repository }}/sunapi:${{ github.sha }}

            - name: Tag as latest
              uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
              with:
                  version: "0.20.1"
                  cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
                  call: publish --source=. --address=ghcr.io/${{ github.repository }}/sunapi:latest

    deploy-cf-worker:
        name: Deploy Cloudflare Worker
        runs-on: ubuntu-latest
        needs: [lint, test, test-cf-worker]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        environment: production
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  persist-credentials: false

            - name: Deploy to Cloudflare
              uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
              with:
                  version: "0.20.1"
                  cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
                  call: deploy-cf-worker --source=. --cloudflare-api-token=env:CLOUDFLARE_API_TOKEN --cloudflare-account-id=env:CLOUDFLARE_ACCOUNT_ID
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
