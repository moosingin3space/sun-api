name: PR Checks

on:
    pull_request:
        branches: [main]
    repository_dispatch:
        types: [dagger-update-complete]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions: {}

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false

            - name: Run lint
              uses: dagger/dagger-for-github@d913e70051faf3b907d4dd96ef1161083c88c644 # v8.2.0
              with:
                  version: "0.19.9"
                  cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
                  call: lint --source=.

    test:
        name: Test
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false

            - name: Run tests
              uses: dagger/dagger-for-github@d913e70051faf3b907d4dd96ef1161083c88c644 # v8.2.0
              with:
                  version: "0.19.9"
                  cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
                  call: test --source=.

    build:
        name: Build
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false

            - name: Build sunapi binary
              uses: dagger/dagger-for-github@d913e70051faf3b907d4dd96ef1161083c88c644 # v8.2.0
              with:
                  version: "0.19.9"
                  cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
                  call: build --source=. export --path=./sunapi-binary-linux-x86_64

            - name: Upload sunapi binary
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
              with:
                  name: sunapi-binary-linux-x86_64
                  path: ./sunapi-binary-linux-x86_64

            - name: Build container
              uses: dagger/dagger-for-github@d913e70051faf3b907d4dd96ef1161083c88c644 # v8.2.0
              with:
                  version: "0.19.9"
                  cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
                  call: build-container --source=.

    test-cf-worker:
        name: Test Cloudflare Worker
        runs-on: ubuntu-latest
        needs: [lint, test]
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
              with:
                  persist-credentials: false

            - name: Run Cloudflare Worker tests
              uses: dagger/dagger-for-github@d913e70051faf3b907d4dd96ef1161083c88c644 # v8.2.0
              with:
                  version: "0.19.9"
                  cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
                  call: cf-worker-test --source=.
