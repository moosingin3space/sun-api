[package]
name = "sunapi-cf"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
axum = { version = "0.8.7", default-features = false }
console_error_panic_hook = "0.1.7"
futures = { version = "0.3.31", default-features = false }
http-body-util = "0.1.3"
jiff = { version = "0.2.16", default-features = false, features = ["js", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sunapi = { version = "0.1.0", path = "../sunapi", default-features = false }
tower = "0.5.2"
tower-service = "0.3.3"
uuid = { version = "1.0", features = ["v4", "js"] }
worker = { version = "0.7.1", features = ["axum", "http"] }
worker-macros = { version = "0.7.0", features = ["http"] }

[lints]
workspace = true
